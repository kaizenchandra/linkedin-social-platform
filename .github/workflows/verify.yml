name: Verify MVP-4
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Unit, security, Oracle integration tests
        run: ./mvnw -B -ntp clean verify
      - name: Local secrets and infrastructure
        run: |
          python scripts/init-local.py
          docker compose up -d --build --wait --wait-timeout 240
      - name: Real identity and end-to-end APIs
        run: |
          python scripts/auth-test-setup.py
          python scripts/check-pkce.py
          python scripts/smoke.py
          python scripts/check-security.py
          python scripts/check-event-recovery.py
          python scripts/check-dead-letter.py
          python scripts/refresh-session.py
          python scripts/check-restart.py compose
          python scripts/check-mvp2-upgrade.py
          for check in check-mvp2-privacy check-mvp2-media check-media-recovery check-mvp2-messaging; do
            python scripts/auth-test-setup.py
            python scripts/$check.py
          done
          python scripts/auth-test-setup.py
          python scripts/auth-moderator-setup.py
          python scripts/check-mvp2-moderation.py
          python scripts/auth-test-setup.py
          python scripts/auth-moderator-setup.py
          python scripts/smoke-mvp2.py
          python scripts/check-s3-permissions.py
          python scripts/check-mvp2-failures.py
          python scripts/refresh-session.py
          python scripts/check-mvp2-replay.py
          python scripts/check-mvp2-restart.py database
      - name: Hiring journey, upgrade and recovery
        run: |
          python scripts/auth-hiring-setup.py
          python scripts/smoke-mvp3.py
          python scripts/check-mvp3-internal-security.py
          python scripts/check-mvp3-recovery.py
          TEST_SESSION=.local/hiring-session.json python scripts/refresh-session.py
          python scripts/check-mvp3-restart.py
          python scripts/check-mvp3-upgrade.py
          pip install -r scripts/requirements.lock
          python scripts/check-hiring-contracts.py
      - name: Discovery, alerts and recovery
        run: |
          python scripts/auth-hiring-setup.py
          python scripts/smoke-mvp4.py
          python scripts/check-mvp4-recovery.py
          python scripts/check-mvp4-member-outage.py
          python scripts/check-mvp4-restart.py
          python scripts/check-mvp4-upgrade.py
      - name: Contracts and manifests
        run: |
          pip install -r scripts/requirements.lock
          python scripts/check-contracts.py
          python scripts/check-manifests.py
          python scripts/check-mvp4-contracts-security.py
      - name: Dependency and container vulnerability scan
        run: scripts/scan-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            .local/scans/*.json
            docs/mvp2-*-evidence.json
            docs/mvp3-*-evidence.json
            docs/mvp4-*-evidence.json
      - name: Stop dedicated CI stack
        if: always()
        run: docker compose down
