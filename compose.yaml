name: professional-network-mvp
services:
  oracle:
    image: gvenzl/oracle-free:23.9-slim-faststart@sha256:6e0217d72368dd9c213d75274bc2bcb1682a103680090998a8943a173670aba3
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?run init-local.py}
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?run init-local.py}
      MEMBER_RUNTIME_PASSWORD: ${MEMBER_RUNTIME_PASSWORD:?run init-local.py}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?run init-local.py}
      CONTENT_RUNTIME_PASSWORD: ${CONTENT_RUNTIME_PASSWORD:?run init-local.py}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?run init-local.py}
      NOTIFICATION_RUNTIME_PASSWORD: ${NOTIFICATION_RUNTIME_PASSWORD:?run init-local.py}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      MEDIA_RUNTIME_PASSWORD: ${MEDIA_RUNTIME_PASSWORD}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD}
      MESSAGING_RUNTIME_PASSWORD: ${MESSAGING_RUNTIME_PASSWORD}
      HIRING_DB_PASSWORD: ${HIRING_DB_PASSWORD}
      HIRING_RUNTIME_PASSWORD: ${HIRING_RUNTIME_PASSWORD}
    ports:
    - 127.0.0.1:1521:1521
    volumes:
    - oracle-data:/opt/oracle/oradata
    - ./infra/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 60
    shm_size: 1gb
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      KAFKA_MEMBER_PASSWORD: ${KAFKA_MEMBER_PASSWORD}
      KAFKA_CONTENT_PASSWORD: ${KAFKA_CONTENT_PASSWORD}
      KAFKA_NOTIFICATION_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD}
      KAFKA_MESSAGING_PASSWORD: ${KAFKA_MESSAGING_PASSWORD}
      KAFKA_HIRING_PASSWORD: ${KAFKA_HIRING_PASSWORD}
    volumes:
    - kafka-data:/var/lib/kafka/data
    - ./infra/kafka:/opt/network:ro
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --command-config
        /tmp/admin.properties --list >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
    command:
    - /bin/bash
    - /opt/network/start.sh
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command:
    - start-dev
    - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run init-local.py}
      CONTENT_CLIENT_SECRET: ${CONTENT_CLIENT_SECRET:?run init-local.py}
      METRICS_CLIENT_SECRET: ${METRICS_CLIENT_SECRET:?run init-local.py}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: 'true'
      MEDIA_CLIENT_SECRET: ${MEDIA_CLIENT_SECRET}
      MESSAGING_CLIENT_SECRET: ${MESSAGING_CLIENT_SECRET}
      HIRING_CLIENT_SECRET: ${HIRING_CLIENT_SECRET}
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET}
    ports:
    - 127.0.0.1:8180:8080
    volumes:
    - keycloak-data:/opt/keycloak/data
    - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n"
        >&3; cat <&3 | grep -q UP'
      interval: 10s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  member-service:
    image: professional-network/member-service:0.4.0
    build:
      context: .
      args:
        MODULE: member-service
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/network
      OIDC_JWKS: http://keycloak:8080/realms/network/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      MEMBER_URL: http://member-service:8080
      CONTENT_URL: http://content-service:8080
      NOTIFICATION_URL: http://notification-service:8080
      OIDC_TOKEN_URL: http://keycloak:8080/realms/network/protocol/openid-connect/token
      CONTENT_CLIENT_SECRET: ${CONTENT_CLIENT_SECRET}
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: member_runtime
      DB_SCHEMA: member_app
      DB_PASSWORD: ${MEMBER_RUNTIME_PASSWORD}
      MIGRATIONS_ENABLED: 'false'
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_USER: member
      KAFKA_PASSWORD: ${KAFKA_MEMBER_PASSWORD}
    ports:
    - 127.0.0.1:8081:8080
    depends_on:
      member-migration:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 640m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9090; printf "GET /actuator/health/readiness
        HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q UP'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  content-service:
    image: professional-network/content-service:0.4.0
    build:
      context: .
      args:
        MODULE: content-service
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/network
      OIDC_JWKS: http://keycloak:8080/realms/network/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      MEMBER_URL: http://member-service:8080
      CONTENT_URL: http://content-service:8080
      NOTIFICATION_URL: http://notification-service:8080
      OIDC_TOKEN_URL: http://keycloak:8080/realms/network/protocol/openid-connect/token
      CONTENT_CLIENT_SECRET: ${CONTENT_CLIENT_SECRET}
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: content_runtime
      DB_SCHEMA: content_app
      DB_PASSWORD: ${CONTENT_RUNTIME_PASSWORD}
      MIGRATIONS_ENABLED: 'false'
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_USER: content
      KAFKA_PASSWORD: ${KAFKA_CONTENT_PASSWORD}
    ports:
    - 127.0.0.1:8082:8080
    depends_on:
      content-migration:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 640m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9090; printf "GET /actuator/health/readiness
        HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q UP'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  notification-service:
    image: professional-network/notification-service:0.4.0
    build:
      context: .
      args:
        MODULE: notification-service
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/network
      OIDC_JWKS: http://keycloak:8080/realms/network/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      MEMBER_URL: http://member-service:8080
      CONTENT_URL: http://content-service:8080
      HIRING_URL: http://hiring-service:8080
      INTERNAL_CLIENT_ID: notification-internal
      INTERNAL_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET}
      NOTIFICATION_URL: http://notification-service:8080
      OIDC_TOKEN_URL: http://keycloak:8080/realms/network/protocol/openid-connect/token
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: notification_runtime
      DB_SCHEMA: notification_app
      DB_PASSWORD: ${NOTIFICATION_RUNTIME_PASSWORD}
      MIGRATIONS_ENABLED: 'false'
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_USER: notification
      KAFKA_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD}
    ports:
    - 127.0.0.1:8083:8080
    depends_on:
      notification-migration:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 640m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9090; printf "GET /actuator/health/readiness
        HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q UP'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  api-gateway:
    image: professional-network/api-gateway:0.4.0
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/network
      OIDC_JWKS: http://keycloak:8080/realms/network/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      MEMBER_URL: http://member-service:8080
      CONTENT_URL: http://content-service:8080
      NOTIFICATION_URL: http://notification-service:8080
      OIDC_TOKEN_URL: http://keycloak:8080/realms/network/protocol/openid-connect/token
      CONTENT_CLIENT_SECRET: ${CONTENT_CLIENT_SECRET}
      MEDIA_URL: http://media-service:8080
      MESSAGING_URL: http://messaging-service:8080
      HIRING_URL: http://hiring-service:8080
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      keycloak:
        condition: service_healthy
      member-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      hiring-service:
        condition: service_healthy
    mem_limit: 640m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9090; printf "GET /actuator/health/readiness
        HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q UP'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  member-migration:
    image: professional-network/member-service:0.4.0
    entrypoint:
    - java
    - -Dloader.main=dev.network.web.Migrate
    - -cp
    - /app/app.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: member_app
      DB_PASSWORD: ${MEMBER_DB_PASSWORD}
      DB_RUNTIME_USER: member_runtime
    depends_on:
      oracle:
        condition: service_healthy
  content-migration:
    image: professional-network/content-service:0.4.0
    entrypoint:
    - java
    - -Dloader.main=dev.network.web.Migrate
    - -cp
    - /app/app.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: content_app
      DB_PASSWORD: ${CONTENT_DB_PASSWORD}
      DB_RUNTIME_USER: content_runtime
    depends_on:
      oracle:
        condition: service_healthy
  notification-migration:
    image: professional-network/notification-service:0.4.0
    entrypoint:
    - java
    - -Dloader.main=dev.network.web.Migrate
    - -cp
    - /app/app.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: notification_app
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      DB_RUNTIME_USER: notification_runtime
    depends_on:
      oracle:
        condition: service_healthy
  kafka-init:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    command:
    - /bin/bash
    - /opt/network/init.sh
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
    volumes:
    - ./infra/kafka:/opt/network:ro
    depends_on:
      kafka:
        condition: service_healthy
  object-store:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
    - mini
    - -dir=/data
    - -s3.config=/run/secrets/s3-identities.json
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: network-media
    volumes:
    - object-data:/data
    - ./.local/s3-identities.json:/run/secrets/s3-identities.json:ro
    ports:
    - 127.0.0.1:8333:8333
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://localhost:9333/cluster/status
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  media-service:
    image: professional-network/media-service:0.4.0
    build:
      context: .
      args:
        MODULE: media-service
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/network
      OIDC_JWKS: http://keycloak:8080/realms/network/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      MEMBER_URL: http://member-service:8080
      CONTENT_URL: http://content-service:8080
      NOTIFICATION_URL: http://notification-service:8080
      OIDC_TOKEN_URL: http://keycloak:8080/realms/network/protocol/openid-connect/token
      CONTENT_CLIENT_SECRET: ${CONTENT_CLIENT_SECRET}
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: media_runtime
      DB_SCHEMA: media_app
      DB_PASSWORD: ${MEDIA_RUNTIME_PASSWORD}
      MIGRATIONS_ENABLED: 'false'
      INTERNAL_CLIENT_ID: media-internal
      INTERNAL_CLIENT_SECRET: ${MEDIA_CLIENT_SECRET}
      S3_ENDPOINT: http://object-store:8333
      S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY}
      HIRING_URL: http://hiring-service:8080
    ports:
    - 127.0.0.1:8084:8080
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      media-migration:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    mem_limit: 640m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9090; printf "GET /actuator/health/readiness
        HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q UP'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  media-migration:
    image: professional-network/media-service:0.4.0
    entrypoint:
    - java
    - -Dloader.main=dev.network.web.Migrate
    - -cp
    - /app/app.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: media_app
      DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      DB_RUNTIME_USER: media_runtime
    depends_on:
      oracle:
        condition: service_healthy
  messaging-service:
    image: professional-network/messaging-service:0.4.0
    build:
      context: .
      args:
        MODULE: messaging-service
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/network
      OIDC_JWKS: http://keycloak:8080/realms/network/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      MEMBER_URL: http://member-service:8080
      CONTENT_URL: http://content-service:8080
      NOTIFICATION_URL: http://notification-service:8080
      OIDC_TOKEN_URL: http://keycloak:8080/realms/network/protocol/openid-connect/token
      CONTENT_CLIENT_SECRET: ${CONTENT_CLIENT_SECRET}
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: messaging_runtime
      DB_SCHEMA: messaging_app
      DB_PASSWORD: ${MESSAGING_RUNTIME_PASSWORD}
      MIGRATIONS_ENABLED: 'false'
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_USER: messaging
      KAFKA_PASSWORD: ${KAFKA_MESSAGING_PASSWORD}
      INTERNAL_CLIENT_ID: messaging-internal
      INTERNAL_CLIENT_SECRET: ${MESSAGING_CLIENT_SECRET}
    ports:
    - 127.0.0.1:8085:8080
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      messaging-migration:
        condition: service_completed_successfully
    mem_limit: 640m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9090; printf "GET /actuator/health/readiness
        HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q UP'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  messaging-migration:
    image: professional-network/messaging-service:0.4.0
    entrypoint:
    - java
    - -Dloader.main=dev.network.web.Migrate
    - -cp
    - /app/app.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: messaging_app
      DB_PASSWORD: ${MESSAGING_DB_PASSWORD}
      DB_RUNTIME_USER: messaging_runtime
    depends_on:
      oracle:
        condition: service_healthy
  hiring-service:
    image: professional-network/hiring-service:0.4.0
    build:
      context: .
      args:
        MODULE: hiring-service
    environment:
      OIDC_ISSUER: http://localhost:8180/realms/network
      OIDC_JWKS: http://keycloak:8080/realms/network/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      MEMBER_URL: http://member-service:8080
      CONTENT_URL: http://content-service:8080
      NOTIFICATION_URL: http://notification-service:8080
      OIDC_TOKEN_URL: http://keycloak:8080/realms/network/protocol/openid-connect/token
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: hiring_runtime
      DB_SCHEMA: hiring_app
      DB_PASSWORD: ${HIRING_RUNTIME_PASSWORD}
      MIGRATIONS_ENABLED: 'false'
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_USER: hiring
      KAFKA_PASSWORD: ${KAFKA_HIRING_PASSWORD}
      INTERNAL_CLIENT_ID: hiring-internal
      INTERNAL_CLIENT_SECRET: ${HIRING_CLIENT_SECRET}
    ports:
    - 127.0.0.1:8086:8080
    depends_on:
      keycloak:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hiring-migration:
        condition: service_completed_successfully
    mem_limit: 640m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/9090; printf "GET /actuator/health/readiness
        HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q UP'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  hiring-migration:
    image: professional-network/hiring-service:0.4.0
    entrypoint:
    - java
    - -Dloader.main=dev.network.web.Migrate
    - -cp
    - /app/app.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: hiring_app
      DB_PASSWORD: ${HIRING_DB_PASSWORD}
      DB_RUNTIME_USER: hiring_runtime
    depends_on:
      oracle:
        condition: service_healthy
volumes:
  oracle-data: null
  kafka-data: null
  keycloak-data: null
  object-data: null
